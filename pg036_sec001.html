          <span class="sr-only" aria-hidden="true" data-audio-description-for="pg036_im001" data-id="pg036_im001_audio_description">Anza kufinyanga umbo la mtu kwa kuandaa udongo. Tumia mikono kutengeneza maumbo ya kichwa, kiwiliwili, mikono, miguu na nyayo.</span>
        </figure>
        <section aria-labelledby="pg036-steps-heading">
          <h2 id="pg036-steps-heading" class="adt-h2 instruction" data-id="pg036_n0004">Hatua za kufinyanga umbo la mtu</h2>
          <figure class="lesson-figure">
            <img src="./images/pg036_im002.png" alt="Hatua saba za kufinyanga umbo la mtu: tengeneza kichwa, kiwiliwili, mikono, miguu na nyayo; unganisha maumbo hayo, kisha kamilisha umbo la mtu." data-id="pg036_im002">
            <span class="sr-only" aria-hidden="true" data-audio-description-for="pg036_im002" data-id="pg036_im002_audio_description">Hatua ya kwanza: Finyanga udongo kuwa umbo la duara kwa ajili ya kichwa. Hatua ya pili: Finyanga umbo refu kwa ajili ya kiwiliwili. Hatua ya tatu: Finyanga vipande viwili vyembamba kwa ajili ya mikono. Hatua ya nne: Finyanga vipande viwili virefu kwa ajili ya miguu. Hatua ya tano: Finyanga vipande viwili vidogo kwa ajili ya nyayo. Hatua ya sita: Unganisha kichwa, kiwiliwili, mikono, miguu na nyayo kulingana na umbo la mtu. Hatua ya saba: Umbo la mtu lipo tayari.</span>
          </figure>
