  <header class="book-header"><p class="chapter-kicker" data-id="pg047049_n0001">Kupiga chapa</p><h1 id="pg047049-heading" class="adt-h1" data-id="pg047049_n0002">Tuchape kwa kugandamiza</h1></header>
  <section aria-labelledby="pg047049-materials-heading"><h2 id="pg047049-materials-heading" class="adt-h2" data-id="pg047049_n0003">Vifaa</h2><p data-id="pg047049_n0004">Jani, karatasi, rangi ya maji, penseli, brashi</p><figure class="lesson-figure"><img src="./images/pg047049_im001.png" alt="Karatasi, jani, rangi ya maji, penseli na brashi." data-id="pg047049_im001"><figcaption class="lesson-caption" data-id="pg047049_n0006">1. Chukua karatasi, rangi, jani na brashi. Weka juu ya meza.</figcaption><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im001" data-id="pg047049_im001_audio_description">Vifaa vya kuchapa kwa kugandamiza vimepangwa na kila kimoja kimeandikwa jina.</span></figure></section>
  <section aria-labelledby="pg047049-steps-heading"><h2 id="pg047049-steps-heading" class="adt-h2 instruction" data-id="pg047049_n0005">Hatua za kuchapa kwa kugandamiza</h2><div class="picture-grid">
    <figure class="picture-card"><img src="./images/pg047049_im002.png" alt="Mwanafunzi akiweka karatasi na vifaa juu ya meza." data-id="pg047049_im002"><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im002" data-id="pg047049_im002_audio_description">Mwanafunzi anaweka karatasi nyeupe mezani karibu na jani, brashi na rangi.</span></figure>
    <figure class="picture-card"><img src="./images/pg047049_im003.png" alt="Mwanafunzi akipaka rangi juu ya jani kwa brashi." data-id="pg047049_im003"><figcaption class="lesson-caption" data-id="pg047049_n0007">2. Anza kupaka rangi juu ya jani kwa kutumia brashi.</figcaption><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im003" data-id="pg047049_im003_audio_description">Mwanafunzi anatumia brashi kupaka rangi ya kijani juu ya jani.</span></figure>
    <figure class="picture-card"><img src="./images/pg047049_im004.png" alt="Mwanafunzi akigandamiza jani lenye rangi kwenye karatasi." data-id="pg047049_im004"><figcaption class="lesson-caption" data-id="pg047049_n0008">3. Gandamiza jani lenye rangi kwenye karatasi nyeupe.</figcaption><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im004" data-id="pg047049_im004_audio_description">Mwanafunzi ameweka jani lenye rangi kwenye karatasi nyeupe na analigandamiza kwa mikono.</span></figure>
    <figure class="picture-card"><img src="./images/pg047049_im005.png" alt="Mwanafunzi akionesha karatasi iliyojazwa chapa za majani ya kijani." data-id="pg047049_im005"><figcaption class="lesson-caption" data-id="pg047049_n0009">4. Gandamiza na bandua jani mojamoja lenye rangi ya kijani hadi uijaze karatasi.</figcaption><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im005" data-id="pg047049_im005_audio_description">Karatasi anayoishika mwanafunzi ina chapa nyingi za majani ya kijani.</span></figure>
    <figure class="picture-card"><img src="./images/pg047049_im006.png" alt="Karatasi yenye chapa za majani ya rangi mbalimbali." data-id="pg047049_im006"><figcaption class="lesson-caption" data-id="pg047049_n0010">5. Gandamiza na kubandua majani yaliyopakwa rangi tofautitofauti ili kupata unamu wenye rangi tofauti.</figcaption><span class="sr-only" aria-hidden="true" data-audio-description-for="pg047049_im006" data-id="pg047049_im006_audio_description">Chapa za majani zina rangi za kijani, buluu, manjano, chungwa, nyekundu na zambarau.</span></figure>
